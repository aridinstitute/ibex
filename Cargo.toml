[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/adapter-surreal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kaden/oeuvre"
authors = ["Kaden"]

[workspace.dependencies]
oeuvre-core = { path = "crates/core" }
oeuvre-app = { path = "crates/app" }
oeuvre-adapter-surreal = { path = "crates/adapter-surreal" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
