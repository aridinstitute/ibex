[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/adapter-surreal",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kaden/oeuvre"
authors = ["Kaden"]

[workspace.dependencies]
oeuvre-core = { path = "crates/core" }
oeuvre-app = { path = "crates/app" }
oeuvre-adapter-surreal = { path = "crates/adapter-surreal" }
oeuvre-cli = { path = "crates/cli" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
ulid = { version = "3", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
surrealdb = { version = "2.3", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
criterion = { version = "0.5", features = ["async_tokio"] }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
dialoguer = "0.11"
dirs = "6"
anyhow = "1"
