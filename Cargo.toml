[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "crates/adapter-surreal",
    "crates/cli",
    "crates/gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kaden/oeuvre"
authors = ["Kaden"]

[workspace.dependencies]
ibex-core = { path = "crates/core" }
ibex-app = { path = "crates/app" }
ibex-adapter-surreal = { path = "crates/adapter-surreal" }
ibex-cli = { path = "crates/cli" }

async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
ulid = { version = "3", features = ["serde"] }
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
surrealdb = { version = "3.3.4", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile = "3"
clap = { version = "4", features = ["derive", "env"] }
gpui-kit = "0.8"
dialoguer = "0.12.0"
dirs = "7.0.0"
anyhow = "1"
biblatex = "0.12"
unicode-normalization = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
