name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_call:
  workflow_dispatch:
    inputs:
      coverage:
        description: Generate a non-blocking Linux coverage report
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

defaults:
  run:
    shell: bash

jobs:
  hygiene:
    name: Formatting and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - run: cargo fmt --all -- --check
      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
      - name: Portable tests, Clippy, and docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          packages=(-p ibex-core -p ibex-app -p ibex-adapter-surreal -p ibex-cli)
          cargo test --locked "${packages[@]}" --features ibex-app/testing
          cargo clippy --locked "${packages[@]}" --all-targets --features ibex-app/testing -- -D warnings
          cargo doc --locked "${packages[@]}" --no-deps
      - name: GUI tests, Clippy, and docs
        if: runner.os == 'macOS'
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo test --locked -p ibex-gui
          cargo clippy --locked -p ibex-gui --all-targets -- -D warnings
          cargo doc --locked -p ibex-gui --no-deps
      # Optimized builds are slow; PRs skip them, and pushes to release/** and
      # main (plus release tags, via workflow_call) still catch regressions.
      - name: Benchmark compilation
        if: github.event_name != 'pull_request'
        run: cargo bench --locked -p ibex-app -p ibex-adapter-surreal --features ibex-app/testing --no-run
      - name: Optimized CLI build and smoke test
        if: github.event_name != 'pull_request'
        run: |
          cargo build --locked --release -p ibex-cli
          target/release/ibex --version
          target/release/ibex --memory resource list
      - name: Optimized GUI build
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: |
          cargo build --locked --release -p ibex-gui
          target/release/ibex-gui --version

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: tools
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny --locked check

  coverage:
    name: Coverage report (informational)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.coverage)
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: coverage
      - run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
          cargo llvm-cov --locked -p ibex-core -p ibex-app -p ibex-adapter-surreal -p ibex-cli \
            --features ibex-app/testing --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 14

  gate:
    name: CI gate
    if: always()
    needs: [hygiene, test, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking job to pass
        env:
          HYGIENE: ${{ needs.hygiene.result }}
          TEST: ${{ needs.test.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
        run: |
          test "$HYGIENE" = success
          test "$TEST" = success
          test "$DEPENDENCIES" = success
