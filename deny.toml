[graph]
all-features = true

[advisories]
unmaintained = "workspace"
# Each entry reaches Ibex only through SurrealDB 3.3.5 internals that require
# semver-incompatible upgrades to fix. Ibex runs SurrealDB embedded (kv-mem,
# kv-surrealkv) without JWT auth or cloud object stores, so the vulnerable
# paths are not exercised. Revisit whenever the SurrealDB version changes.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa via jsonwebtoken (SurrealDB JWT auth, unused); no patched release exists" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken (SurrealDB JWT auth, unused); fix needs 0.7" },
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39 via object_store cloud backends (unused); fix needs object_store 0.14" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39 via object_store cloud backends (unused); fix needs object_store 0.14" },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # SurrealDB; reviewed and accepted for Ibex.
    "BUSL-1.1",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
